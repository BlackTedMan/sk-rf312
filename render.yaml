services:
  - type: web
    name: sk-server
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sk-db
          property: connectionString

databases:
  - name: sk-db
    plan: free
